services:
  mysql:
    image: mysql:8.0
    container_name: subscription-engine-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: suscripciones
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
